<text x="1022" y="264" text-anchor="middle" fill="#DCCCF5" font-family="Comic Sans MS, Trebuchet MS, cursive" font-size="17" font-style="italic">with big dreams</text>
<text x="1022" y="286" text-anchor="middle" fill="#DCCCF5" font-family="Comic Sans MS, Trebuchet MS, cursive" font-size="17" font-style="italic">(and more bugs)</text>
