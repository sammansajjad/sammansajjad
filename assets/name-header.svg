<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Samman Sajjad — Controlled Chaos</title>
<desc id="desc">A chaotic, hand-drawn developer poster with neon doodles on a charcoal background.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211720"/><stop offset=".52" stop-color="#171318"/><stop offset="1" stop-color="#21162a"/></linearGradient>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/></filter>
</defs>
<rect width="1200" height="470" rx="20" fill="url(#bg)"/>
