<text x="600" y="279" text-anchor="middle" fill="#FFF9D9" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-style="italic" letter-spacing="3">SOFTWARE  /  AI  /  CONTROLLED CHAOS</text>
