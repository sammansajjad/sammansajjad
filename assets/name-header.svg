<text x="600" y="378" text-anchor="middle" fill="#24151A" font-family="Comic Sans MS, Trebuchet MS, cursive" font-size="23" font-weight="700" font-style="italic">Teaching machines to see.</text>
<text x="600" y="401" text-anchor="middle" fill="#24151A" font-family="Comic Sans MS, Trebuchet MS, cursive" font-size="16" font-style="italic">debugging my way through life.</text>
